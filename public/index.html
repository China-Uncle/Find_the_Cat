// Pure domain layer — portable to a WeChat Mini Program. No browser globals or I/O.
// Exact MRV over rows/columns/regions. Compute once on load, never per tap.
class PuzzleSolver {
  constructor(n, map) {
    if (!Number.isInteger(n) || n < 1 || n > 12 || !map || map.length !== n * n || Array.from(map).some(g => !Number.isInteger(g) || g < 0 || g >= n)) throw new Error('无效的棋盘');
    this.n = n; this.map = map;
  }
  // Exact MRV over THREE constraint families: rows, regions and columns. No time cutoff can masquerade as uniqueness.
  solve({ limit = 2, fixed = [], banned = [], onProgress } = {}) {
    if (!Number.isInteger(limit) || limit < 1) throw new Error('limit 必须为正整数');
    const { n, map } = this, full = (1 << n) - 1, rowC = new Int8Array(n).fill(-1), ban = new Uint8Array(n * n);
    for (const id of banned) { if (!Number.isInteger(id) || id < 0 || id >= n * n) throw new Error('无效的排除位置'); ban[id] = 1; }
    let usedR = 0, usedC = 0, usedG = 0, count = 0, nodes = 0, solution = null;
    for (const id of fixed) {
      if (!Number.isInteger(id) || id < 0 || id >= n * n || ban[id]) return { count: 0, nodes: 0, solution: null };
      const r = Math.floor(id / n), c = id % n, g = map[id];
      if ((usedR & (1 << r)) || (usedC & (1 << c)) || (usedG & (1 << g)) ||
          (r > 0 && rowC[r - 1] >= 0 && Math.abs(rowC[r - 1] - c) <= 1) ||
          (r + 1 < n && rowC[r + 1] >= 0 && Math.abs(rowC[r + 1] - c) <= 1)) return { count: 0, nodes: 0, solution: null };
      rowC[r] = c; usedR |= 1 << r; usedC |= 1 << c; usedG |= 1 << g;
    }
    // Depth-local buffers avoid candidate array churn and preserve a parent's MRV candidates on return.
    const masks = Array.from({ length: n + 1 }, () => new Uint16Array(n));
    const regionCounts = Array.from({ length: n + 1 }, () => new Uint16Array(n));
    const colCounts = Array.from({ length: n + 1 }, () => new Uint16Array(n));
    const dfs = (ur, uc, ug, depth) => {
      nodes++;
      if (onProgress && nodes % 2048 === 0) onProgress(nodes);
      if (ur === full) { count++; if (!solution) solution = Array.from(rowC, (c, r) => r * n + c); return count >= limit; }
      const rc = masks[depth], gc = regionCounts[depth], cc = colCounts[depth]; gc.fill(0); cc.fill(0);
      let min = Infinity, kind = 0, group = -1;
      for (let r = 0; r < n; r++) {
        rc[r] = 0; if (ur & (1 << r)) continue;
        let available = full & ~uc;
        // Only adjacent rows can violate the 8-neighbor rule; columns already exclude all vertical neighbors.
        for (const nr of [r - 1, r + 1]) if (nr >= 0 && nr < n && rowC[nr] >= 0) {
          const b = 1 << rowC[nr]; available &= ~(b | (b << 1) | (b >>> 1));
        }
        let num = 0;
        while (available) {
          const bit = available & -available; available -= bit; const c = 31 - Math.clz32(bit), id = r * n + c, g = map[id];
          if ((ug & (1 << g)) || ban[id]) continue;
          rc[r] |= bit; num++; gc[g]++; cc[c]++;
        }
        if (!num) return false; // Forward checking: a missing row has zero candidates.
        if (num < min) { min = num; kind = 0; group = r; }
      }
      for (let g = 0; g < n; g++) {
        if (!(ug & (1 << g))) { if (!gc[g]) return false; if (gc[g] < min) { min = gc[g]; kind = 1; group = g; } }
        if (!(uc & (1 << g))) { if (!cc[g]) return false; if (cc[g] < min) { min = cc[g]; kind = 2; group = g; } }
      }
      for (let r = 0; r < n; r++) {
        if (kind === 0 && r !== group) continue;
        let available = rc[r];
        while (available) {
          const bit = available & -available; available -= bit; const c = 31 - Math.clz32(bit), g = map[r * n + c];
          if ((kind === 1 && g !== group) || (kind === 2 && c !== group)) continue;
          rowC[r] = c;
          const stop = dfs(ur | (1 << r), uc | bit, ug | (1 << g), depth + 1);
          rowC[r] = -1;
          if (stop) return true; // Stop immediately on the second solution (or requested limit).
        }
      }
      return false;
    };
    dfs(usedR, usedC, usedG, fixed.length);
    return { count, nodes, solution };
  }
}
class GameEngine {
  constructor(onChange=()=>{}){this.onChange=onChange;this.resetData();}
  resetData(){this.level=null;this.run=null;this.solution=new Set();this.marks=[];this.hearts=3;this.elapsedMs=0;this.status='idle';this.revision=0;this.onChange(this.snapshot());}
  static prepare(level){
    const solved=new PuzzleSolver(level.size,level.regions).solve({limit:2});
    if(solved.count!==1)throw new Error('关卡不是唯一解，请联系管理员检查题库');
    return solved.solution;
  }
  load(level,run,answer=GameEngine.prepare(level)){
    this.level={...level};this.run={...run};this.solution=new Set(answer);
    this.marks=Array(level.size**2).fill(0);
    for(const c of run.cats)if(this.solution.has(c))this.marks[c]=2;
    this.hearts=run.hearts;this.elapsedMs=run.elapsedMs;this.revision=run.revision;this.status=run.status;
    this.onChange(this.snapshot());
  }
  snapshot(){return {level:this.level,run:this.run,marks:[...this.marks],hearts:this.hearts,elapsedMs:this.elapsedMs,revision:this.revision,status:this.status};}
  setElapsed(ms){this.elapsedMs=ms;}
  setHearts(n){this.hearts=n;this.onChange(this.snapshot());}
  setStatus(s){this.status=s;this.onChange(this.snapshot());}
  applyMark(cell,value){
    if(this.status!=='playing'||!Number.isInteger(cell)||cell<0||cell>=this.marks.length||![0,1].includes(value)||this.marks[cell]===2)return false;
    this.marks[cell]=value;this.onChange(this.snapshot());return true;
  }
  // Local-only mutation. Hearts are a casual-game mechanic, not a security boundary.
  move(cell,operation){
    if(this.status!=='playing'||!Number.isInteger(cell)||cell<0||cell>=this.marks.length||!['place','remove'].includes(operation))return null;
    if(operation==='remove'){
      if(this.marks[cell]!==2)return null;
      this.marks[cell]=0;
    }else{
      if(this.marks[cell]===2)return null;
      if(!this.solution.has(cell)){
        this.marks[cell]=0;this.hearts--;
        if(!this.hearts)this.status='failed';
        this.onChange(this.snapshot());return {correct:false,cell,status:this.status,hearts:this.hearts};
      }
      this.marks[cell]=2;
      if(this.marks.filter(mark=>mark===2).length===this.level.size)this.status='ready';
    }
    this.onChange(this.snapshot());return {correct:true,cell,status:this.status,hearts:this.hearts};
  }
  // Validate persisted local drafts rather than trusting arbitrary browser JSON.
  validLocalDraft(draft){
    return !!draft&&Array.isArray(draft.marks)&&draft.marks.length===this.marks.length&&
      draft.marks.every((v,i)=>[0,1,2].includes(v)&&(v!==2||this.solution.has(i)))&&
      Number.isInteger(draft.hearts)&&draft.hearts>=0&&draft.hearts<=3;
  }
  restoreCrosses(draft){
    if(!this.validLocalDraft(draft))return false;
    draft.marks.forEach((v,i)=>{if(v===1&&this.marks[i]!==2)this.marks[i]=1});
    this.onChange(this.snapshot());return true;
  }
  restoreLocal(draft){
    if(!['playing','ready'].includes(this.status)||!this.validLocalDraft(draft))return false;
    this.marks=[...draft.marks];this.hearts=Math.min(this.hearts,draft.hearts);
    this.status=!this.hearts?'failed':this.marks.filter(v=>v===2).length===this.level.size?'ready':'playing';
    this.onChange(this.snapshot());return true;
  }
}
// Portable tutorial domain: no browser APIs, storage, timers or network.
// Validate the actual board's partition and solution; never assume numeric region labels.
class TutorialController {
  constructor(level, answer, {skipped=false}={}) {
    this.step=0;this.skipped=!!skipped;this.mapping=null;this.regions=null;
    if(level?.id!==1||level.size!==4||!Array.isArray(level.regions)||level.regions.length!==16)return;
    const reference=[0,0,1,1,0,0,1,1,0,2,3,3,0,2,2,3],cats=[2,4,11,13];
    const actual=new Set(answer);
    if(actual.size!==4)return;
    // D4 symmetry + a bijection of region labels, not merely four matching cats.
    for(let symmetry=0;symmetry<8;symmetry++) {
      const map=Array.from({length:16},(_,cell)=>{
        let r=Math.floor(cell/4),c=cell%4;
        if(symmetry>=4)c=3-c;
        for(let k=0;k<symmetry%4;k++){const old=r;r=c;c=3-old;}
        return r*4+c;
      });
      const labels=new Map(),reverse=new Map();let matches=true;
      for(let i=0;i<16;i++){
        const a=reference[i],b=level.regions[map[i]];
        if((labels.has(a)&&labels.get(a)!==b)||(reverse.has(b)&&reverse.get(b)!==a)){matches=false;break}
        labels.set(a,b);reverse.set(b,a);
      }
      if(matches&&cats.every(cell=>actual.has(map[cell]))){this.mapping=map;this.regions=labels;break}
    }
    if(this.mapping)this.step=1;
  }
  get active(){return !!this.mapping&&!this.skipped&&this.step>=1&&this.step<=5}
  skip(){this.skipped=true;}
  export(){return {version:1,skipped:this.skipped};}
  cells(ids){return ids.map(id=>this.mapping[id]);}
  targets(){return !this.active?[]:this.cells(this.step===1?[8,12]:[[13],[11],[2],[4]][this.step-2]);}
  allows(cell,action){return !this.active||(this.targets().includes(cell)&&(action==='pointer'||(this.step===1?action==='mark':action==='place')));}
  // Existing cats may come from a resumed run, including an out-of-order free play.
  // Teach the first still-missing cat; never remove restored progress or reset hearts.
  reconcile(marks,status){
    if(!this.mapping||this.skipped)return [];
    if(status!=='playing'){this.step=0;return []}
    const order=this.cells([13,11,2,4]),missing=order.findIndex(cell=>marks[cell]!==2);
    if(missing<0){this.step=0;return []}
    this.step=!order.some(cell=>marks[cell]===2)&&this.cells([8,12]).some(cell=>marks[cell]!==1)?1:missing+2;
    const demos=this.step<=2?[]:this.step===3?[8,12,9,10,14]:this.step===4?[8,12,9,10,14,3,7,6,15]:[8,12,9,10,14,3,7,6,15,0,1,5];
    return this.cells(demos).filter(cell=>marks[cell]===0);
  }
  message(colorName) {
    if(!this.active)return '';
    const pos=id=>{const cell=this.mapping[id];return `第${Math.floor(cell/4)+1}行第${cell%4+1}列`};
    const line=(a,b)=>{const x=this.mapping[a],y=this.mapping[b];return Math.floor(x/4)===Math.floor(y/4)?`第${Math.floor(x/4)+1}行`:`第${x%4+1}列`};
    const yellow=colorName(this.regions.get(0)),green=colorName(this.regions.get(1)),red=colorName(this.regions.get(2)),orange=colorName(this.regions.get(3));
    return [
      `💡 ${red}、${orange}两色都只在${line(8,9)}和${line(12,13)}，各需一只猫，所以高亮的两格${yellow}必无猫。单击或按住滑动，给它们打 ×！`,
      `🐱 ${red}猫若在${pos(9)}，${orange}猫只能在${pos(15)}，使${line(4,5)}无处放猫；若在${pos(14)}，会封死所有${orange}格。双击高亮格找出第1只猫！`,
      `✨ 已演示排除相邻与同线格，${line(8,9)}只剩${pos(11)}的${orange}格。双击高亮格，找出第2只猫！`,
      `🎯 ${orange}猫占了${line(3,7)}，并封住相邻格，${green}只剩${pos(2)}。双击高亮格，找出第3只猫！`,
      `🎉 最后一只！${line(4,5)}只剩${pos(4)}的${yellow}格。双击找出第4只猫，就能通关啦！`
    ][this.step-1];
  }
}

// Transient view feedback survives board re-renders, without entering the portable game state.
function clearCellFeedback(cell) {

    if (feedback) clearTimeout(feedback.timer);
    UI.cellErrors.delete(index);
    const node = document.querySelector(`[data-cell="${index}"]`);
    node?.classList.remove('error');
    node?.removeAttribute('aria-invalid');
  };

// Pure layout math: keep one board footprint across 4–11 columns, rather than
// fixing each cell at 24px and making early levels microscopic.
function boardTileSize(n, width, height, paddingX, paddingY, columnGap, rowGap) {
  const side = Math.max(0, Math.min(width, height, 560));
  return Math.max(1, Math.min(
    (side - paddingX - columnGap * (n - 1)) / n,
    (side - paddingY - rowGap * (n - 1)) / n
  ));
}
function fitBoard() {
  const play = document.querySelector('.play');
  const label = $('subrow');
  const board = $('board');
  if (!play || !board || !UI.size) return;

  // Measure the allocated play area, never the content-sized board frame:
  // measuring the frame feeds the current small tile size back into itself.
  const playStyle = getComputedStyle(play);
  const boardStyle = getComputedStyle(board);
  const number = value => parseFloat(value) || 0;
  const height = Math.max(0, play.clientHeight - (label?.offsetHeight || 0) - number(playStyle.rowGap));
  const tile = boardTileSize(UI.size, play.clientWidth, height,
    number(boardStyle.paddingLeft) + number(boardStyle.paddingRight),
    number(boardStyle.paddingTop) + number(boardStyle.paddingBottom),
    number(boardStyle.columnGap), number(boardStyle.rowGap));
  board.style.setProperty('--fit-tile', `${tile}px`);
}

// Per-account, per-mode, per-run drafts. Storage/network stay outside GameEngine.
function draftKey(mode=UI.mode){return `local-run:${UI.account?.id??'session'}:${mode}`;}

function saveLocalRun(){

function backupLocalDraft(draft,reason){
  const key=draftKey(),backupKey=key+':conflict';
  // Only compact, known draft fields are copied; browser JSON is not trusted storage.
  if(!draft||!Array.isArray(draft.marks)||draft.marks.length>121||
    typeof draft.runId!=='string'||draft.runId.length>64||typeof draft.regions!=='string'||draft.regions.length>1024)return;
  const previous=UI.drafts.get(backupKey)||(UI.account?.id?readStoredJson(backupKey):null);
  const old=previous?.draft;
  // Do not replace the original conflict with its later merged/locked projection or a restart.
  if(previous&&(reason!=='server-revision-changed'||(old?.runId===draft.runId&&old.revision===draft.revision&&old.regions===draft.regions)))return;
  const saved={version:draft.version,runId:draft.runId,levelId:draft.levelId,size:draft.size,
    revision:draft.revision,regions:draft.regions,marks:[...draft.marks],hearts:draft.hearts,conflict:!!draft.conflict};
  const backup={reason,draft:saved},json=JSON.stringify(backup);
  if(json.length>16384)return;

  const stored=!UI.account?.id||PlatformAdapter.setStorage(backupKey,json)!==false;

function restoreLocalRun(){

    draft.size===e.level.size&&draft.regions===e.level.regions.join(',');
  if(!sameBoard||!Number.isSafeInteger(draft.revision)||draft.revision<0||!e.validLocalDraft(draft)){backupLocalDraft(draft,'different-or-invalid-board');return}

  const playable=['playing','ready'].includes(e.status);
  const wasReady=draft.marks.filter(v=>v===2).length===e.level.size;

async function loadLevel(restart = false, {mode = UI.mode, levelId = UI.practiceLevel} = {}) {

  UI.loading = true;
  const epoch = ++UI.gameEpoch;

  try {

    const data = await PlatformAdapter.request(gameApi('start', mode), {method: 'POST', body});
    if (epoch !== UI.gameEpoch) return false;
    // Validate/solve before replacing the old board. No hidden answer is downloaded.
    const answer=data.allComplete?null:GameEngine.prepare(data.level);

    UI.completionResult = null;
    closeModal();

  if(UI.loading||!UI.engine?.run||!tutorialAllows(cell,operation))return;
  const result=UI.engine.move(cell,operation);
  if(!result)return;
  advanceTutorial();
  if(operation==='place'&&!result.correct){flagCellError(cell);render(UI.engine.snapshot());toast(`放错啦，剩余 ${result.hearts} 颗心`);}

async function finishLevel() {

  cancelGesture();
  UI.engine.setStatus('submitting');
  const payload = { runId: UI.engine.run.id, levelId: UI.level, cats: UI.engine.marks.flatMap((mark, i) => mark === 2 ? [i] : []) };
  const submit = async () => {
    try {
      const result = await PlatformAdapter.request(gameApi('submit',mode), { method: 'POST', body: payload });
      if (epoch === UI.gameEpoch && UI.engine?.run?.id === payload.runId) {UI.engine.setElapsed(result.elapsedMs);UI.engine.setStatus('completed');saveLocalRun();if(mode==='practice')showPracticeWin(result);else showWin(result);}

  $('normalMode').onclick=()=>loadLevel(false,{mode:'normal'}).catch(showError);
  $('practiceMode').onclick=async()=>{
    const levelId=Number($('practiceLevel').value);
    if(!Number.isSafeInteger(levelId)||levelId<1)return toast('请输入有效关卡编号');
    try {await loadLevel(true,{mode:'practice',levelId});} catch(e){showError(e)}
  };
}
function showPracticeWin(result) {
  rememberCompletion(result);
  const next=result.nextLevelId;
  modal(`试关完成 · 第 ${result.levelId} 关`,`<p>用时 <b>${formatTime(result.elapsedMs)}</b></p><p>仅供测试：没有写入排行榜，也没有改变正式关卡进度。</p>${next?'<button class="primary" id="practiceNext">试下一关</button>':''}<button class="primary" id="practiceAgain">重新试这一关</button><button class="close" id="practiceChoose">选择其他关卡 / 返回正常模式</button>`);
  if(next)$('practiceNext').onclick=async()=>{try{await loadLevel(true,{mode:'practice',levelId:next});}catch(e){showError(e)}};
  $('practiceAgain').onclick=async()=>{try{await loadLevel(true,{mode:'practice',levelId:result.levelId});}catch(e){showError(e)}};
  $('practiceChoose').onclick=showMode;
}

function leaderboardProviderLabel(provider){
  switch(provider){
    case 'github': return 'GitHub';
    case 'password': return '账号密码';
    case 'wechat': return '微信';
    default: return '未知方式';
  }
}
async function showRank(){
  try{
    const d=await PlatformAdapter.request('/api/leaderboard?limit=100');
    const medals=['🥇','🥈','🥉'];
    const rows=d.rows.map(u=>`<div class="row leader-row"><span class="medal">${medals[u.rank-1]||u.rank}</span>${u.avatarUrl?`<img class="avatar" src="${esc(u.avatarUrl)}" alt="">`:'🐱'}<span><span class="leader-name">${esc(u.username)}</span> <span class="leader-provider">${leaderboardProviderLabel(u.authProvider)}</span></span><span><b>${u.cleared}</b> 关 · ${formatTime(u.totalMs)}</span></div>`).join('');
    modal('全服总榜',`<div class="rows">${rows||'<div class="empty">还没有公开成绩，来成为第一个上榜的猫友吧。</div>'}</div>`);
  }catch(e){showError(e)}
}
function showAdmin(){modal('扩展题库',`<p>追加关卡会在后台生成并自动去重。单次最多 1000 关；任务完成后关卡列表自动更新。</p><label class="field">追加数量<input id="adminCount" type="number" min="1" max="1000" value="50"></label><label class="field">管理员密钥<input id="adminSecret" type="password" autocomplete="current-password"></label><button class="primary" id="generate">开始生成</button><div id="jobProgress"></div>`);$('generate').onclick=startGeneration}
async function startGeneration(){const count=Number($('adminCount').value),secret=$('adminSecret').value;if(!Number.isInteger(count)||count<1||count>1000)return toast('请输入 1–1000 的关卡数');$('generate').disabled=true;try{const {jobId}=await PlatformAdapter.request('/api/admin/generate-levels',{method:'POST',body:{count},headers:{'X-Admin-Secret':secret}});const poll=async()=>{try{const d=await PlatformAdapter.request('/api/admin/generation-jobs/'+encodeURIComponent(jobId));const j=d.job;$('jobProgress').textContent=`${j.created_count}/${j.requested} · 当前共 ${d.totalLevels} 关`;if(j.status==='done'){toast(`生成完成：第 ${j.start_level}–${j.end_level} 关`);$('generate').disabled=false;return}if(j.status==='failed'){toast(j.error||'生成失败');$('generate').disabled=false;return}setTimeout(poll,1000)}catch(e){toast(e.message);$('generate').disabled=false}};poll()}catch(e){$('generate').disabled=false;toast(e.message)}}
function guestId(){let id=PlatformAdapter.getStorage('guest-id');if(!id){id=crypto.randomUUID();PlatformAdapter.setStorage('guest-id',id)}return id}
function browserSecret(){let s=PlatformAdapter.getStorage('browser-secret');if(!s){const bytes=crypto.getRandomValues(new Uint8Array(32));s=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');PlatformAdapter.setStorage('browser-secret',s)}return s}
async function githubLogin(){try{const secret=browserSecret(),digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(secret)),hash=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');const {url}=await PlatformAdapter.request('/api/auth/github/start?browser_hash='+hash);location.assign(url)}catch(e){showError(e)}}
async function finishOAuth(){const p=new URLSearchParams(location.hash.slice(1));if(p.has('auth_error')){history.replaceState(null,'',location.pathname);showLogin();toast(p.get('auth_error'));return}if(!p.has('login_ticket'))return;const ticket=p.get('login_ticket');history.replaceState(null,'',location.pathname);try{const d=await PlatformAdapter.request('/api/auth/exchange',{method:'POST',body:{ticket,browserSecret:browserSecret()}});PlatformAdapter.setStorage('token',d.accessToken);await boot()}catch(e){showError(e)}}
async function guestLogin(){try{const name=prompt('本地测试昵称','测试猫友');if(name===null)return;const d=await PlatformAdapter.request('/api/auth/guest',{method:'POST',body:{username:name,guestId:guestId()}});PlatformAdapter.setStorage('token',d.accessToken);await initialize()}catch(e){showError(e)}}
// A separate account, not a username-based link or guest-progress conversion.
function showPasswordAuth(register=false){
  if(!UI.config?.passwordLogin)return;
  modal(register?'注册用户名账号':'用户名登录',`<form id="passwordForm">
    <p>无需邮箱或验证码。用户名忽略大小写，仅支持 3–24 位英文字母、数字、下划线。密码为 12–128 个 UTF-8 字节，不能有控制字符或首尾空白。</p>
    <p>用户名账号与同名 GitHub 账号、游客账号相互独立，不合并进度。所有正式账号使用同一全服排行榜。</p>
    <label class="field" for="passwordUsername">用户名<input id="passwordUsername" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="3" maxlength="64" aria-describedby="passwordError"></label>
    <label class="field" for="passwordInput">密码<input id="passwordInput" name="password" type="password" autocomplete="${register?'new-password':'current-password'}" required maxlength="128" aria-describedby="passwordError"></label>
    <p id="passwordError" class="password-error" role="alert" aria-live="polite"></p>
    <button class="primary" id="passwordSubmit" type="submit">${register?'注册并开始':'登录'}</button>
    <button class="close" id="passwordSwitch" type="button">${register?'已有账号？去登录':'没有账号？注册'}</button>
  </form>`);
  const epoch=UI.modalEpoch,form=$('passwordForm'),username=$('passwordUsername'),password=$('passwordInput'),submit=$('passwordSubmit'),toggle=$('passwordSwitch'),error=$('passwordError');
  let pending=false;
  toggle.onclick=()=>{password.value='';showPasswordAuth(!register)};
  form.onsubmit=async event=>{
    event.preventDefault();if(pending)return;
    const raw=username.value.trim(),value=password.value,bytes=new TextEncoder().encode(value).length;
    if(!/^[A-Za-z0-9_]{3,24}$/.test(raw)){error.textContent='用户名须为 3–24 位英文字母、数字或下划线';return}
    if(!value.isWellFormed()||bytes<12||bytes>128||value!==value.trim()||/[\u0000-\u001f\u007f-\u009f]/u.test(value)){error.textContent='密码须为 12–128 个 UTF-8 字节，且不能有控制字符或首尾空白';return}
    pending=true;submit.disabled=true;toggle.disabled=true;error.textContent='';
    let session;
    try{
      session=await PlatformAdapter.request('/api/auth/'+(register?'register':'login'),{method:'POST',body:{username:raw.toLowerCase(),password:value},expireSession:false});
    }catch(e){if(epoch===UI.modalEpoch)error.textContent=e.message;return}
    finally{password.value='';pending=false;submit.disabled=false;toggle.disabled=false}
    if(epoch!==UI.modalEpoch)return;
    if(UI.account)saveLocalRun();
    UI.gameEpoch++;UI.mode='normal';UI.drafts.clear();UI.completionResult=null;UI.loading=false;UI.completeLock=false;UI.tutorial=null;clearCellFeedback();UI.engine?.resetData();
    PlatformAdapter.setStorage('token',session.accessToken);PlatformAdapter.removeStorage('user');renderAccount(session.user);closeModal();
    try{await loadSessionLevel()}catch(e){showError(e)}
  };
  username.focus?.();
}
function renderAccount(user){UI.account=user;$('accountBtn').hidden=!!user&&!user.isGuest;$('accountBtn').textContent='登录 / 注册';$('account').hidden=!user;$('adminBtn').hidden=!user?.isAdmin;$('modeBtn').hidden=!user?.isAdmin;if(user){$('account').innerHTML=`${user.avatar_url?`<img class="avatar" src="${esc(user.avatar_url)}" alt="">`:'🐱'}<span class="username">${esc(user.username)}</span>`;$('account').title='点击退出登录';$('account').onclick=logout;}else showLogin();}
async function logout(){UI.gameEpoch++;UI.mode='normal';UI.drafts.clear();UI.completionResult=null;UI.loading=false;UI.completeLock=false;clearCellFeedback();UI.tutorial=null;UI.engine.resetData();PlatformAdapter.removeStorage('token');PlatformAdapter.removeStorage('user');renderAccount(null);closeModal();await initialize()}
async function initialize(){
  UI.config=await PlatformAdapter.request('/api/config');
  if(!PlatformAdapter.getStorage('token')){renderAccount(null);showLogin();return}
  let me;
  try{me=await PlatformAdapter.request('/api/me')}catch(error){
    if(error.status===401){renderAccount(null);showLogin();return}
    throw error;
  }
  renderAccount(me.user);await loadSessionLevel();
}
function showLogin(){UI.tutorial=null;cancelGesture();clearInterval(UI.timerHandle);UI.timerHandle=null;renderTutorial();$('title').textContent='找猫';setWelcomeView(true);renderWelcomeConfig();}
function pointerCell(e){const board=$('board'),rect=board.getBoundingClientRect(),style=getComputedStyle(board),pad=parseFloat(style.paddingLeft),gap=parseFloat(style.columnGap),inner=rect.width-2*pad,x=e.clientX-rect.left-pad,y=e.clientY-rect.top-pad,size=(inner-gap*(UI.size-1))/UI.size,c=Math.floor(x/(size+gap)),r=Math.floor(y/(size+gap));if(r<0||c<0||r>=UI.size||c>=UI.size||x%(size+gap)>size||y%(size+gap)>size)return -1;return r*UI.size+c}
async function singleTap(cell){const mark=UI.engine.marks[cell];if(mark===2)return;markCell(cell,mark===1?0:1)}
function bind(){renderLegend();$('welcomePassword').onclick=()=>{if(UI.config?.passwordLogin)showPasswordAuth()};$('welcomeLogin').onclick=()=>{if(UI.config?.githubLogin)githubLogin()};$('welcomeGuest').onclick=()=>{if(UI.config?.guestLogin)guestLogin()};$('tutorialSkip').onclick=skipTutorial;$('accountBtn').onclick=()=>UI.config?.passwordLogin?showPasswordAuth():UI.config?.githubLogin?githubLogin():UI.config?.guestLogin?guestLogin():showLogin();$('levelsBtn').onclick=showLevels;$('rankBtn').onclick=showRank;$('modeBtn').onclick=showMode;$('adminBtn').onclick=showAdmin;$('restart').onclick=()=>loadLevel(true).catch(showError);$('modal').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b&&!b.disabled){closeModal();loadLevel(false,{mode:UI.mode,levelId:Number(b.dataset.open)}).catch(showError)}});const board=$('board');board.addEventListener('contextmenu',e=>e.preventDefault());board.addEventListener('pointerdown',e=>{const cell=pointerCell(e);if(UI.loading||cell<0||UI.engine?.status!=='playing'||!tutorialAllows(cell,'pointer'))return;e.preventDefault();board.setPointerCapture(e.pointerId);UI.gesture={id:e.pointerId,start:cell,last:cell,x:e.clientX,y:e.clientY,drag:false,erase:UI.engine.marks[cell]===1,visited:new Set()}});board.addEventListener('pointermove',e=>{const g=UI.gesture;if(!g||g.id!==e.pointerId)return;const cell=pointerCell(e);if(cell<0)return;if(!g.drag&&Math.hypot(e.clientX-g.x,e.clientY-g.y)>7)g.drag=true;if(g.drag&&cell!==g.last){const step=g.erase?0:1;if(UI.engine.marks[cell]!==2)markCell(cell,step);g.visited.add(cell);g.last=cell}});const up=e=>{const g=UI.gesture;if(!g||g.id!==e.pointerId)return;UI.gesture=null;if(g.drag){if(UI.engine.marks[g.start]!==2)markCell(g.start,g.erase?0:1);return}const now=performance.now();if(UI.lastTap.cell===g.start&&now-UI.lastTap.time<310){UI.lastTap={cell:-1,time:0};if(UI.engine.marks[g.start]===2)move(g.start,'remove');else move(g.start,'place')}else{UI.lastTap={cell:g.start,time:now};singleTap(g.start)}};board.addEventListener('pointerup',up);board.addEventListener('pointercancel',()=>UI.gesture=null);window.addEventListener('resize',fitBoard);if(typeof ResizeObserver!=='undefined'){UI.layoutObserver=new ResizeObserver(fitBoard);UI.layoutObserver.observe(document.querySelector('.play'));}document.addEventListener('visibilitychange',handleVisibility);window.addEventListener('pagehide',flushLocalRun);}
// Display follows server wall time, including hidden-tab time; the server owns scoring.
function updateClock(){
  if(UI.engine?.run&&UI.engine.status==='playing'){
    const now=performance.now();UI.engine.setElapsed(UI.engine.elapsedMs+Math.max(0,now-UI.lastClock));UI.lastClock=now;
    $('timer').textContent=formatTime(UI.engine.elapsedMs);
  }
}
function startClock(){
  clearInterval(UI.timerHandle);UI.timerHandle=null;UI.lastClock=performance.now();
  if(!document.hidden&&UI.engine?.run&&UI.engine.status==='playing')UI.timerHandle=setInterval(updateClock,250);
}
function handleVisibility(){
  if(document.hidden)flushLocalRun();
  updateClock();
  if(document.hidden){clearInterval(UI.timerHandle);UI.timerHandle=null}else startClock();
}
async function boot(){
  UI.engine=new GameEngine(render);bind();UI.config=await PlatformAdapter.request('/api/config');
  const hashParams=new URLSearchParams(location.hash.slice(1));
  if(hashParams.has('login_ticket')||hashParams.has('auth_error'))return finishOAuth();
  if(PlatformAdapter.getStorage('token'))return initialize();
  if(UI.config.guestLogin){
    const d=await PlatformAdapter.request('/api/auth/guest',{method:'POST',body:{username:'本地猫友',guestId:guestId()}});
    PlatformAdapter.setStorage('token',d.accessToken);renderAccount(d.user);await loadSessionLevel();return;
  }
  renderAccount(null);showLogin();
}
boot().catch(showError);
</script>
